name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (dev deps + auto-installed peers)
        run: npm ci --ignore-scripts
      - name: Type check (strict)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke-load the built entry
        run: node -e "import('./lib/index.js').then(m => { if (!m.apply || !m.inject) throw new Error('bad entry exports') ; console.log('entry ok:', Object.keys(m).join(', ')) })"
      - name: Verify DSH 0.2.2-rc.4
        run: npm run check:dsh -- 0.2.2-rc.4
      - name: Verify DSH 0.2.2-rc.5
        run: npm run check:dsh -- 0.2.2-rc.5
